<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1ff">
  <title>ピクセル気分メーカー</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      background: #f6f1ff;
      color: #30284a;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      place-items: center;
      background:
        radial-gradient(ellipse at 10% 12%, #ffe1d8 0, transparent 30%),
        radial-gradient(ellipse at 90% 86%, #dcd7ff 0, transparent 34%),
        #f6f1ff;
    }
    main {
      width: min(100%, 680px);
      padding: clamp(24px, 6vw, 48px);
      border: 2px solid #fff;
      border-radius: 32px;
      background: #fffdfb;
      box-shadow: 0 24px 70px #62518d20, 0 3px 0 #e9e1fa;
      text-align: center;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: #806bb1;
      font-size: .75rem;
      font-weight: 900;
      letter-spacing: .16em;
    }
    .eyebrow::before, .eyebrow::after { width: 18px; height: 2px; background: #c7b9ea; content: ""; }
    h1 { margin: 10px 0 7px; font-size: clamp(1.8rem, 7vw, 2.8rem); letter-spacing: .03em; }
    .subtitle { margin: 0; color: #827b94; font-size: .96rem; }
    .pixel-stage {
      display: grid;
      min-height: 330px;
      margin: 28px 0 20px;
      place-items: center;
      overflow: hidden;
      border: 1px solid #eee8f8;
      border-radius: 24px;
      background: linear-gradient(145deg, #fcf9ff, #f8f3ff);
    }
    .pixel-board {
      width: clamp(208px, 62vw, 272px);
      aspect-ratio: 1;
      border: 8px solid #fff;
      border-radius: 12px;
      background-color: #f2ecfc;
      background-image: linear-gradient(#ded5ee 1px, transparent 1px), linear-gradient(90deg, #ded5ee 1px, transparent 1px);
      background-size: calc(100% / 16) calc(100% / 16);
      box-shadow: 0 10px 22px #51406e20, 0 0 0 1px #e9e1f4;
      image-rendering: pixelated;
    }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .status {
      min-height: 26px;
      margin: 0 0 22px;
      color: #756795;
      font-size: .9rem;
      font-weight: 750;
    }
    .picker-heading { margin: 0 0 12px; font-size: .92rem; font-weight: 850; }
    .expressions { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .expression-button {
      display: grid;
      min-height: 92px;
      padding: 12px 5px 10px;
      place-items: center;
      gap: 5px;
      border: 2px solid #eee8f6;
      border-radius: 18px;
      background: #fff;
      color: #625778;
      font: inherit;
      font-size: .82rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }
    .expression-button:hover { transform: translateY(-3px); border-color: #d3c4f1; }
    .expression-button[aria-pressed="true"] {
      border-color: #9c7ce2;
      background: #f5f0ff;
      box-shadow: 0 4px 0 #e5dcf8;
      color: #6047a0;
    }
    .expression-button:focus-visible { outline: 3px solid #7454bf; outline-offset: 3px; }
    .expression-icon { font-size: 1.65rem; line-height: 1; }
    .hint { margin: 18px 0 0; color: #a19aac; font-size: .76rem; }
    @media (max-width: 440px) {
      body { padding: 16px 10px; }
      main { padding: 24px 16px; border-radius: 26px; }
      .pixel-stage { min-height: 290px; }
      .expressions { gap: 6px; }
      .expression-button { min-height: 82px; border-radius: 14px; font-size: .74rem; }
      .expression-icon { font-size: 1.45rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">16 × 16 PIXEL MOOD</p>
    <h1>ピクセル気分メーカー</h1>
    <p class="subtitle">今の気分を、ちいさなドット絵に。</p>

    <section class="pixel-stage" aria-label="選択した表情のドット絵">
      <div class="pixel-board">
        <canvas id="face" width="16" height="16" role="img" aria-label="にこにこ顔の16×16ドット絵"></canvas>
      </div>
    </section>
    <p class="status" id="status" aria-live="polite">にこにこ を選択中</p>

    <h2 class="picker-heading">表情をえらんでね</h2>
    <div class="expressions" role="group" aria-label="表情を選択">
      <button class="expression-button" type="button" data-expression="happy" aria-pressed="true"><span class="expression-icon" aria-hidden="true">😊</span><span>にこにこ</span></button>
      <button class="expression-button" type="button" data-expression="excited" aria-pressed="false"><span class="expression-icon" aria-hidden="true">🤩</span><span>わくわく</span></button>
      <button class="expression-button" type="button" data-expression="sad" aria-pressed="false"><span class="expression-icon" aria-hidden="true">😢</span><span>かなしい</span></button>
      <button class="expression-button" type="button" data-expression="surprised" aria-pressed="false"><span class="expression-icon" aria-hidden="true">😮</span><span>びっくり</span></button>
      <button class="expression-button" type="button" data-expression="sleepy" aria-pressed="false"><span class="expression-icon" aria-hidden="true">😴</span><span>ねむねむ</span></button>
    </div>
    <p class="hint">ボタンを押すと、16×16の表情が切り替わります</p>
  </main>

  <script>
    const faceShape = [
      '......ssss......',
      '....ssssssss....',
      '...ssssssssss...',
      '..ssssssssssss..',
      '.ssssssssssssss.',
      '.ssssssssssssss.',
      '.ssssssssssssss.',
      '.ssssssssssssss.',
      '.ssssssssssssss.',
      '.ssssssssssssss.',
      '..ssssssssssss..',
      '..ssssssssssss..',
      '...ssssssssss...',
      '....ssssssss....',
      '......ssss......',
      '................'
    ];
    const expressions = {
      happy: {
        name: 'にこにこ',
        eyes: [[ [4, 7], [5, 7], [6, 6] ], [ [9, 6], [10, 7], [11, 7] ]],
        mouth: [[6, 9], [7, 9], [8, 9], [9, 9], [5, 10], [10, 10], [6, 11], [7, 11], [8, 11], [9, 11]],
        cheeks: [[3, 9], [4, 10], [11, 10], [12, 9]]
      },
      excited: {
        name: 'わくわく',
        eyes: [[ [4, 6], [5, 6], [4, 7], [5, 7], [4, 8], [5, 8] ], [ [10, 6], [11, 6], [10, 7], [11, 7], [10, 8], [11, 8] ]],
        mouth: [[6, 9], [7, 9], [8, 9], [9, 9], [6, 10], [7, 10], [8, 10], [9, 10], [7, 11], [8, 11]],
        cheeks: [[3, 9], [4, 10], [11, 10], [12, 9]],
        sparkles: [[2, 4], [13, 4], [2, 5], [13, 5]]
      },
      sad: {
        name: 'かなしい',
        eyes: [[ [4, 7], [5, 7], [4, 8], [5, 8] ], [ [10, 7], [11, 7], [10, 8], [11, 8] ]],
        brows: [[4, 5], [5, 6], [10, 6], [11, 5]],
        mouth: [[6, 10], [7, 9], [8, 9], [9, 10]],
        tear: [[12, 8], [12, 9], [11, 10]]
      },
      surprised: {
        name: 'びっくり',
        eyes: [[ [4, 6], [5, 6], [4, 7], [5, 7], [4, 8], [5, 8] ], [ [10, 6], [11, 6], [10, 7], [11, 7], [10, 8], [11, 8] ]],
        brows: [[4, 5], [5, 5], [10, 5], [11, 5]],
        mouth: [[7, 9], [8, 9], [6, 10], [9, 10], [6, 11], [9, 11], [7, 12], [8, 12]]
      },
      sleepy: {
        name: 'ねむねむ',
        eyes: [[ [4, 7], [5, 7], [6, 7] ], [ [9, 7], [10, 7], [11, 7] ]],
        brows: [[4, 6], [5, 6], [10, 6], [11, 6]],
        mouth: [[7, 10], [8, 10]],
        zzz: [[12, 4], [13, 3], [14, 2]]
      }
    };
    const colors = {
      skin: '#ffc879',
      highlight: '#ffe2a8',
      outline: '#593e61',
      cheek: '#f28791',
      tear: '#63a9ef',
      sparkle: '#f2a83b'
    };
    const canvas = document.querySelector('#face');
    const context = canvas.getContext('2d');
    const buttons = [...document.querySelectorAll('.expression-button')];
    const status = document.querySelector('#status');

    function paintPixels(points, color) {
      context.fillStyle = color;
      points.forEach(([x, y]) => context.fillRect(x, y, 1, 1));
    }

    function drawFace(expressionKey) {
      const expression = expressions[expressionKey];
      context.clearRect(0, 0, 16, 16);
      faceShape.forEach((row, y) => {
        [...row].forEach((pixel, x) => {
          if (pixel === 's') {
            context.fillStyle = x < 5 && y < 8 ? colors.highlight : colors.skin;
            context.fillRect(x, y, 1, 1);
          }
        });
      });
      expression.cheeks && paintPixels(expression.cheeks, colors.cheek);
      expression.eyes.forEach((eye) => paintPixels(eye, colors.outline));
      expression.brows && paintPixels(expression.brows, colors.outline);
      paintPixels(expression.mouth, colors.outline);
      expression.tear && paintPixels(expression.tear, colors.tear);
      expression.sparkles && paintPixels(expression.sparkles, colors.sparkle);
      expression.zzz && paintPixels(expression.zzz, colors.tear);
      canvas.setAttribute('aria-label', `${expression.name}の16×16ドット絵`);
      status.textContent = `${expression.name} を選択中`;
      buttons.forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.expression === expressionKey));
      });
    }

    buttons.forEach((button) => {
      button.addEventListener('click', () => drawFace(button.dataset.expression));
    });
    drawFace('happy');
  </script>
</body>
</html>
